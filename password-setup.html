<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <title>設定登入密碼｜房聯網</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #F6F4EF; color: #1A3A5F; font: 16px/1.7 'Noto Sans TC',sans-serif; }
    main { width: min(100% - 40px, 480px); margin: clamp(28px,8vh,90px) auto; }
    .brand { display: flex; gap: 12px; align-items: center; font-size: 22px; font-weight: 700; }
    .brand img { width: 48px; height: 48px; }
    h1 { font-size: clamp(28px,6vw,36px); margin: 32px 0 12px; }
    p { margin: 0 0 24px; }
    label { display: block; margin: 22px 0 6px; font-weight: 600; }
    input { width: 100%; border: 1px solid #93A0AD; border-radius: 8px; padding: 13px; font: inherit; background: white; }
    small { display: block; color: #526477; margin-top: 6px; }
    button { width: 100%; margin-top: 28px; padding: 14px; background: #1A3A5F; border: 0; border-radius: 8px; color: white; font: inherit; cursor: pointer; }
    button:hover { background: #10263B; } button:disabled { opacity: .6; cursor: wait; }
    :focus-visible { outline: 3px solid #966C27; outline-offset: 3px; }
    #message { margin: 20px 0; overflow-wrap: anywhere; } #message.error { color: #A82B28; }
    #account { overflow-wrap: anywhere; }
    .cancel { background: none; color: #1A3A5F; text-decoration: underline; margin-top: 8px; }
    .cancel:hover { background: #EAE6DE; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="photo/icons/logo-mark.png" alt="" />房聯網</div>
    <h1 id="heading">設定登入密碼</h1>
    <p>請先完成密碼設定，之後即可進入你的專區。</p>
    <p id="account"></p>
    <form id="passwordForm" hidden>
      <label for="password">新密碼</label>
      <input id="password" type="password" autocomplete="new-password" minlength="12" required aria-describedby="passwordHelp" />
      <small id="passwordHelp">至少 12 個字元，建議搭配英文、數字與符號。</small>
      <label for="confirmation">再次輸入新密碼</label>
      <input id="confirmation" type="password" autocomplete="new-password" minlength="12" required />
      <button id="savePassword" type="submit">儲存密碼並進入專區</button>
    </form>
    <p id="message" role="status" aria-live="polite">正在確認連結…</p>
    <button type="button" class="cancel" id="cancelSetup">取消並登出</button>
    <noscript>請啟用 JavaScript 後重新開啟信中的連結。</noscript>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.js"></script>
  <script src="assets/js/password-setup.js"></script>
</body>
</html>
